databaseChangeLog:
  - changeSet:
      id: 1
      author: alexandr_kravchenko
      changes:
        - createTable:
            tableName: teachers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false