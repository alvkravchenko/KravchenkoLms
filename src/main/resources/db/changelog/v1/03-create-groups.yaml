databaseChangeLog:
  - changeSet:
      id: 3
      author: alexandr_kravchenko
      changes:
        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false